version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      aws:
        patterns: ["github.com/aws/*"]
      go-modules:
        patterns: ["*"]
        exclude-patterns: ["github.com/aws/*"]

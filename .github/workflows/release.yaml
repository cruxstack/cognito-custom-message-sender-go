name: release

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Bump Version
        id: tag_version
        uses: cruxstack/gh-create-semver-tag-action@81a68a34ab1fb48f4568ddd10e76caf9a608108e # v1.0.0
        with:
          bump-default: minor
          bump-rules: bug:patch:Fixes,chore:patch:Chores,docs:patch:Documentation,test:patch:Tests,ci:patch:Development,dev:patch:Development
      - name: Build Lambda Artifacts
        env:
          VERSION: ${{ steps.tag_version.outputs.tag }}
        run: |
          mkdir -p release
          for arch in arm64 amd64; do
            make build GOARCH="$arch" VERSION="$VERSION"
            (cd dist && zip -q "../release/bootstrap_linux_${arch}.zip" bootstrap)
          done
          (cd release && sha256sum *.zip > checksums.txt)
      - name: Create Release
        if: steps.tag_version.outputs.tag != ''
        uses: cruxstack/gh-create-release-action@3a56a12ce0c6e8083dc90eb7f77805d72423b3fe # v1.0.0
        with:
          release-tag: ${{ steps.tag_version.outputs.tag }}
          release-body: ${{ steps.tag_version.outputs.changelog }}
          release-if-exists: skip
          release-assets: release/*

name: release

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Bump Version
        id: tag_version
        uses: mathieudutour/github-tag-action@af99e60ce8132224b8e6ebab5023449fe256ed46 # v7.0.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: minor
          # a custom rule that matches a commit's type wins over the default
          # "breaking change -> major" rule, so types that carry breaking
          # changes (feat, fix, refactor) must not be listed here. feat and
          # fix use the default rules, and refactor uses default_bump.
          custom_release_rules: bug:patch:Fixes,chore:patch:Chores,docs:patch:Documentation,test:patch:Tests,ci:patch:Development,dev:patch:Development
      - name: Build Lambda Artifacts
        env:
          VERSION: ${{ steps.tag_version.outputs.new_tag }}
        run: |
          mkdir -p release
          for arch in arm64 amd64; do
            make build GOARCH="$arch" VERSION="$VERSION"
            (cd dist && zip -q "../release/bootstrap_linux_${arch}.zip" bootstrap)
          done
          (cd release && sha256sum *.zip > checksums.txt)
      - name: Create Release
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1.21.0
        with:
          tag: ${{ steps.tag_version.outputs.new_tag }}
          name: ${{ steps.tag_version.outputs.new_tag }}
          body: ${{ steps.tag_version.outputs.changelog }}
          artifacts: release/*
